# Frozen continuation protocol. Test labels never calibrate the detector.
schema_version: '2.0'
dataset_version: HAI-23.05
seed: 1
paths:
  raw_dir: data/raw/hai-23.05
  graph_dir: data/raw/graph/boiler
  processed_dir: data/processed
  artifacts_dir: artifacts
  checkpoint_dir: checkpoints
  reports_dir: reports
  figures_dir: figures
  manifest: data/raw_manifest.json
  tag_schema: config/tag_schema.yaml
  process_graph: config/process_graph.json
  action_catalog: config/action_catalog.yaml
  attack_targets: config/attack_targets_hai2305.yaml
data:
  train_files:
  - hai-train1.csv
  - hai-train2.csv
  - hai-train3.csv
  val_files:
  - hai-train4.csv
  test_files:
  - hai-test1.csv
  - hai-test2.csv
  label_files:
    hai-test1.csv: label-test1.csv
    hai-test2.csv: label-test2.csv
  summary_files:
    hai-test1.csv: summary_label1.txt
    hai-test2.csv: summary_label2.txt
  timestamp_col: timestamp
  label_col: label
window:
  length: 128
  stride: 1
  batch_stride: 5
  pad_mode: replicate
  max_windows_per_segment: 0
scaler:
  residual_scale: std
  clip_z: 10.0
model:
  name: TranAD_C_G_E
  n_window: 128
  lr: 0.0001
  weight_decay: 1.0e-05
  lr_step: 5
  lr_gamma: 0.9
  batch_size: 128
  score_agg: topk
  score_topk: 3
  aux_weight: 1.0
  assoc_weight: 0.01
  memory_weight: 0.001
threshold:
  method: quantile
  quantile: 0.999
  far_per_hour: 0.5
detection:
  min_event_gap_s: 3
  hysteresis: 0.0
attribution:
  method: input_gradient
  update_seconds: 5
  occlusion_fill: train_median
rootcause:
  weights:
    residual: 0.3
    attribution: 0.25
    onset: 0.15
    graph: 0.2
    stability: 0.1
  graph_hops: 2
  onset_quantile: 0.95
  abstain_margin: 0.05
  noise_std: 0.05
  noise_repeats: 4
policy:
  horizon: 5
  lambda_risk: 1.0
  lambda_move: 0.1
  lambda_cost: 0.05
  max_actions_per_step: 1
  abstain:
    rc_confidence_min: 0.3
    surrogate_uncertainty_max: high
    risk_gain_min: 0.0
  risk:
    w_range: 0.5
    w_z: 0.4
    w_uncert: 0.1
surrogate:
  model: ridge
  alpha: 1.0
  fit_max_rows: 200000
  val_coverage_z: 2.0
  gate:
    max_rmse_ratio: 1.5
    min_coverage: 0.8
eval:
  etapr_theta_p: 0.7
  etapr_theta_r: 0.1
  etapr_delta: 0.0
  bootstrap_samples: 2000
  bootstrap_alpha: 0.05
  rca_topk:
  - 1
  - 3
  bootstrap_seed: 2026
  normal_block_seconds: 1800
device: auto
protocol_id: continuation-v2
training:
  max_epochs: 50
  batch_size: 128
  physical_batch_size: null
  train_stride: 1
  early_stopping:
    enabled: true
    min_epochs: 5
    patience: 5
    min_delta_abs: 1.0e-05
    min_delta_rel: 0.001
alarm:
  off_ratio: 0.9
  on_count: 2
  recovery_count: 5
  merge_gap_s: 3
