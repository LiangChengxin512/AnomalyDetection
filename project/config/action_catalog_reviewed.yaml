# Inspection workflow only; engineering schema review does not certify physical controls.
schema_version: '2.0'
review_scope: Software validation of inspection-only routing; no physical action approval
actions:
- id: operator_inspect
  kind: inspect
  description_en: Ask the operator to inspect the top-ranked tag(s) and related equipment.
  equipment_id: operator_inspect
  applies_to:
  - '*'
  required_tags: []
  control_tag: null
  review_status: approved
  approval_level: operator_review
  evidence_source: Always legal; first-line response to any anomaly.
  cooldown_s: 30
  cost: 0.05
  requires: {}
  rollback: No process command is issued.
