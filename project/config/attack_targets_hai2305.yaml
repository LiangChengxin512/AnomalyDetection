# Attack ground truth for HAI 23.05, transcribed from the official
# technical manual (v4.0, pages 31-32, "ATTACK OPERATION" table) and the
# summary_label*.txt time ranges shipped with the dataset.
#
# target_points : literal manipulated points from the manual. SP/points such
#                 as P1_B2016 are internal controller variables that are NOT
#                 SCADA columns (SP attacks are hidden from the HMI by
#                 design), so they cannot be scored directly.
# observable_tags : SCADA columns expected to carry primary evidence,
#                 derived from the manual's documented control loops:
#                   P1-PC: SP P1_B2016 -> CV P1_PCV01D/P1_PCV02D -> PV P1_PIT01
#                   P1-LC: SP P1_B3004 -> CV P1_LCV01D        -> PV P1_LIT01
#                   P1-FC: SP P1_B3005 -> CV P1_FCV03D        -> PV P1_FT03
#                   P1-TC: SP P1_B4002 -> CV P1_FCV01D/P1_FCV02D -> PV P1_TIT01
#                   P1-CC: P1_PP04 (cooling pump command)
#                   P2-SC: SP P2_AutoSD/P2_ManualSD -> CV P2_SCO -> PV P2_SIT01
#                   P2-TC: trip points P2_VTR01/02/03/04, P2_RTR
#                   P3-LC: CV P3_LCP01D / P3_LCV01D -> PV P3_LIT01
#                 AE## internal-point attacks are mapped to the affected
#                 control valve/pump command tags with confidence "low".
#
# Times are the exact labelled ranges from summary_label*.txt (local
# testbed time, 1 s grid). Two label runs may exist that have no manual
# table entry; they are kept with attack_id null and reported separately.

